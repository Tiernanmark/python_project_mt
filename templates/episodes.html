{% extends "base.html" %}

{% block content %}
<h1>Search Frasier Episodes</h1>
    <form method="POST" action="/episodes">
        <input 
            type="text" 
            name="search_query" 
            value="{{ query }}" 
            placeholder="Search..."
            required
            class="search-primary"
        >
        <button type="submit" class="btn btn-primary">Search</button>
        <a href="/episodes" class="btn btn-primary">Clear</a>
    </form>
    <h2>Results:</h2>
    <ul class="episode_results">
        {% for e in results %}
            <li>S:{{ e.season }} E:{{ e.episode }}: <strong>{{ e.title }}</strong> (Aired: {{ e.air_date }})</li>
        {% else %}
            <li>No episodes found matching "{{ query }}".</li>
        {% endfor %}
    </ul>
{% endblock %}
