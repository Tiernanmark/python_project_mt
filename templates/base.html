<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frasier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="container py-4">
            <div class="text-center">
                <a href="{{ url_for('home') }}">
                    <img src="static\images\frasier-frasier-logo-brand-a-transparent.png" alt="">
                </a>
            </div>
        </div>
    </header>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <h1 class="navbar-brand d-lg-none">I'm listening...</h1>
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNav"
                aria-controls="mainNav"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="mainNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('home') }}">
                            Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('about') }}">
                            About
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('episodes_page') }}">
                            Episodes
                        </a>
                    </li>
                     <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('contact') }}">
                            Contact
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container my-5">
        <div>
            {% block content %}
                <h1>Default content</h1>
            {% endblock %}
        </div>
    </main>
    <footer class="mt-5">
        <div class="container text-center">
            <p>"I don't know what to do with those tossed salads and scrambled eggs!"</p>
            <p>"Good night, Seattle."</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
